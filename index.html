<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>国库 DEBATE VAULT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed console. Sticky top bar, facet sidebar (hall only), and a main stage that swaps between Hall, Court and Settings. Hall = groups headed by a data title, each group a flat list of data rows. Colors are generated from a palette's hue/saturation so every scheme stays low-saturation in both modes. */
:root{
  --h:222; --s:24%; --ha:196; --as:42%;
  --bg:hsl(var(--h) var(--s) 9%); --bg2:hsl(var(--h) var(--s) 12%); --bg3:hsl(var(--h) var(--s) 16.5%);
  --line:hsl(var(--h) calc(var(--s) * .8) 22%); --fg:hsl(var(--h) 18% 86%); --fg2:hsl(var(--h) 11% 63%);
  --acc:hsl(var(--ha) var(--as) 66%); --acc-ink:hsl(var(--h) 30% 9%); --acc2:hsl(calc(var(--ha) + 55) calc(var(--as) * .8) 70%);
  --ok:hsl(150 28% 62%); --warn:hsl(38 44% 66%); --bad:hsl(2 52% 68%);
  --glass:hsl(var(--h) var(--s) 11% / .86); --shadow:0 14px 40px hsl(var(--h) 40% 3% / .55);
  --bad-glow:hsl(2 60% 60% / .35); --acc-glow:hsl(var(--ha) 50% 60% / .22);
  --f-display:'Chakra Petch','Noto Sans SC',system-ui,sans-serif;
  --f-body:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:hsl(var(--h) calc(var(--s) * 1.3) 90%); --bg2:hsl(var(--h) calc(var(--s) * 1.3) 93.5%); --bg3:hsl(var(--h) calc(var(--s) * 1.25) 85.5%);
    --line:hsl(var(--h) var(--s) 77%); --fg:hsl(var(--h) 22% 17%); --fg2:hsl(var(--h) 14% 37%);
    --acc:hsl(var(--ha) calc(var(--as) + 8%) 32%); --acc-ink:hsl(var(--h) 30% 95%); --acc2:hsl(calc(var(--ha) + 55) calc(var(--as) * .8) 38%);
    --ok:hsl(150 34% 28%); --warn:hsl(34 62% 29%); --bad:hsl(2 50% 42%);
    --glass:hsl(var(--h) calc(var(--s) * 1.3) 93.5% / .86); --shadow:0 12px 32px hsl(var(--h) 30% 20% / .16);
    --bad-glow:hsl(2 55% 50% / .28); --acc-glow:hsl(var(--ha) 40% 40% / .2); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:hsl(var(--h) calc(var(--s) * 1.3) 90%); --bg2:hsl(var(--h) calc(var(--s) * 1.3) 93.5%); --bg3:hsl(var(--h) calc(var(--s) * 1.25) 85.5%);
  --line:hsl(var(--h) var(--s) 77%); --fg:hsl(var(--h) 22% 17%); --fg2:hsl(var(--h) 14% 37%);
  --acc:hsl(var(--ha) calc(var(--as) + 8%) 32%); --acc-ink:hsl(var(--h) 30% 95%); --acc2:hsl(calc(var(--ha) + 55) calc(var(--as) * .8) 38%);
  --ok:hsl(150 34% 28%); --warn:hsl(34 62% 29%); --bad:hsl(2 50% 42%);
  --glass:hsl(var(--h) calc(var(--s) * 1.3) 93.5% / .86); --shadow:0 12px 32px hsl(var(--h) 30% 20% / .16);
  --bad-glow:hsl(2 55% 50% / .28); --acc-glow:hsl(var(--ha) 40% 40% / .2); color-scheme:light;
}
:root[data-palette="obsidian"]{--h:222;--s:24%;--ha:196;--as:42%}
:root[data-palette="sand"]{--h:36;--s:20%;--ha:30;--as:40%}
:root[data-palette="moss"]{--h:140;--s:14%;--ha:150;--as:30%}
:root[data-palette="dusk"]{--h:268;--s:16%;--ha:285;--as:32%}
:root[data-palette="graphite"]{--h:210;--s:7%;--ha:205;--as:26%}
:root[data-palette="pine"]{--h:184;--s:18%;--ha:172;--as:34%}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.65 var(--f-body);padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
mark{background:var(--acc);color:var(--acc-ink);border-radius:3px;padding:0 2px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

.app{min-height:100vh;display:flex;flex-direction:column;background:transparent;position:relative;z-index:1}

/* Top console */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font:700 20px/1 var(--f-display);letter-spacing:.12em}
.brand small{display:block;font:500 9.5px/1.2 var(--f-mono);letter-spacing:.32em;color:var(--acc);margin-top:3px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--fg2)}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--fg2)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--acc);background:var(--bg3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.solid-danger{background:var(--bad);border-color:var(--bad);color:var(--acc-ink);font-weight:700}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.sq{width:38px;padding:0}
.btn[aria-current="page"]{border-color:var(--acc);color:var(--acc);background:var(--bg3)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--acc-ink);font:700 11px/18px var(--f-mono);text-align:center}
.role{font:500 11.5px var(--f-mono);letter-spacing:.04em;padding:2px 8px;border-radius:6px;border:1px solid currentColor}
.role.visitor{color:var(--fg2)} .role.member{color:var(--acc)} .role.contributor{color:var(--ok)} .role.admin{color:var(--warn)}
.only-m{display:none}

/* Layout */
.layout{flex:1;display:grid;grid-template-columns:272px minmax(0,1fr)}
.layout.nosb{grid-template-columns:minmax(0,1fr)}
.layout.nosb .side{display:none}
.side{border-right:1px solid var(--line);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);align-self:start;max-height:calc(100vh - 66px);overflow:auto}
.sg{margin-bottom:14px}
.sg-h{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:6px 8px;font:600 11.5px var(--f-mono);letter-spacing:.14em;color:var(--fg2)}
.sg-h .ic{transition:transform .2s}
.sg.shut .sg-h .ic{transform:rotate(-90deg)}
.sg.shut .sg-list{display:none}
.fi{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;text-align:left}
.fi:hover{background:var(--bg2)}
.fi.on{background:var(--bg3);border-color:var(--acc);color:var(--acc)}
.fi.zero{opacity:.55}
.fi span:first-child{min-width:0;overflow-wrap:anywhere}
.fi .n{font:500 11.5px var(--f-mono);color:var(--fg2);background:var(--bg2);border-radius:6px;padding:0 7px;min-width:26px;text-align:center}
.fi.on .n{color:var(--acc)}
.scrim{display:none}
.main{min-width:0;padding-block:22px 44px;padding-left:26px;padding-right:max(26px,env(safe-area-inset-right,0px))}
.layout.nosb .main{padding-left:max(26px,env(safe-area-inset-left,0px))}

/* Views & transitions */
.view.in-l{animation:inL .3s ease both}.view.in-r{animation:inR .3s ease both}
.view.out-l{animation:outL .2s ease both}.view.out-r{animation:outR .2s ease both}
@keyframes inL{from{opacity:0;transform:translateX(34px)}}
@keyframes inR{from{opacity:0;transform:translateX(-34px)}}
@keyframes outL{to{opacity:0;transform:translateX(-34px)}}
@keyframes outR{to{opacity:0;transform:translateX(34px)}}

/* Hall */
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:7px}
.stat b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--fg2);font-size:12.5px}
.stat.warn b{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.hint{color:var(--fg2);font-size:12.5px}
.sel{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);padding:0 8px;font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:2px 6px 2px 10px;border:1px solid var(--acc);color:var(--acc);border-radius:999px;font-size:12.5px;background:var(--bg2)}
.fchip button{background:none;border:0;padding:0;display:grid;place-items:center}

/* Data-title group */
.topic{margin-bottom:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.topic-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 18px;text-align:left;border-radius:14px}
.topic-head:hover{background:var(--bg3)}
.topic-head .ic{transition:transform .25s;color:var(--acc)}
.topic.closed .topic-head .ic{transform:rotate(-90deg)}
.topic-t{flex:1;min-width:0}
.topic-t b{display:block;font:600 16px/1.4 var(--f-display);overflow-wrap:anywhere}
.cnt{flex:none;font:500 11.5px var(--f-mono);padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg2);white-space:nowrap}
.topic-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease}
.topic.closed .topic-body{grid-template-rows:0fr}
.topic-clip{overflow:hidden;min-height:0}
.cards{display:block;background:var(--bg);border-radius:0 0 13px 13px}

/* Data row */
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 20px 14px;border-top:1px solid var(--line);min-width:0;transition:background .2s}
.card:hover{background:color-mix(in srgb,var(--bg2) 60%,var(--bg))}
.card.appealed{box-shadow:inset 0 0 0 1px var(--bad),inset 0 0 24px var(--bad-glow)}
.card.off{opacity:.55}
.card-h{display:flex;gap:10px;align-items:flex-start}
.card-h .tags{flex:1;min-width:0}
.dots{flex:none;width:32px;height:32px;margin:-5px -6px 0 0;padding:0;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg2)}
.dots svg{width:18px;height:18px;fill:currentColor;stroke:none}
.dots:hover,.dots[aria-expanded="true"]{border-color:var(--line);background:var(--bg2);color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font:500 11.5px var(--f-mono);border:1px solid var(--line);color:var(--fg2);background:var(--bg2)}
button.tag{cursor:pointer}
.tag.dom{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.tag.form{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 45%,var(--line))}
.tag.ver{color:var(--ok);border-color:var(--ok)}
.tag.yr{color:var(--fg);font-variant-numeric:tabular-nums}
.tag.pend{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.tag.mod{color:var(--warn);border-color:var(--warn)}
.tag.mod:hover{background:var(--bg3)}
.tag svg.ic{width:12px;height:12px}
.tag.flagged{height:18px;padding:0 7px;gap:3px;font-size:11px;line-height:1;color:var(--acc-ink);background:var(--bad);border-color:var(--bad);box-shadow:0 0 6px var(--bad-glow);animation:pulse 2.4s ease-in-out infinite}
.tag.offt{color:var(--fg2);border-style:dashed}
@keyframes pulse{50%{box-shadow:0 0 4px var(--bad-glow)}}
.body{margin:0;font-size:14.5px;line-height:1.8;color:var(--fg);overflow-wrap:anywhere;max-width:110ch}
.src{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font:500 12px var(--f-mono);color:var(--acc);text-decoration:none}
.src span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src em{font-style:normal;color:var(--fg2)}
.src:hover{border-color:var(--acc)}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--fg2)}
.srcrow{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 220px}
.lab2{color:var(--fg2);flex:none}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.time{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.time svg{width:13px;height:13px}
.vote{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font:500 12px var(--f-mono)}
.vote:hover{border-color:var(--fg2)}
.vote.up.on{color:var(--ok);border-color:var(--ok)}
.vote.down.on{color:var(--bad);border-color:var(--bad)}

/* Popover */
.pop{position:fixed;z-index:80;min-width:220px;padding:6px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--shadow);animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop .mi{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left}
.pop .mi:hover{background:var(--bg3)}
.pop .mi.lock{color:var(--fg2)}
.pop .mi.bad{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .ph{padding:8px 12px 6px;font-size:12px;color:var(--fg2);max-width:260px;overflow-wrap:anywhere}

/* Modal */
.ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:hsl(var(--h) 30% 4% / .55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);animation:rise .22s ease}
.modal.wide{width:min(720px,100%)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 20px 4px}
.m-h h2{flex:1;margin:0;font:600 18px var(--f-display)}
.m-b{padding:10px 20px 6px;display:grid;gap:14px}
.m-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 18px}
.field{display:grid;gap:6px}
.field label,.lab{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--fg2)}
.in,.ta{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:0}
.in:focus,.ta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.ta{min-height:110px;resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:max-content;max-width:100%}
.seg button{background:var(--bg);border:0;padding:7px 14px}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.err{color:var(--bad);font-size:12.5px;min-height:1.2em}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 12px;background:var(--bg);font-size:12.5px;color:var(--fg2);overflow-wrap:anywhere}
.idcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:16px}
.timeline li{position:relative;padding-left:14px}
.timeline li::before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--fg2)}
.timeline li.cur::before{border-color:var(--acc);background:var(--acc)}
.tl-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:500 12px var(--f-mono);color:var(--fg2)}
.tl-h b{color:var(--fg)}
.tl-c{margin:6px 0 0;padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.tl-c small{display:block;color:var(--fg2);margin-bottom:4px}
.prog{height:8px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .12s linear}

#toasts{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(420px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);animation:rise .22s ease}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}

/* Court */
.court-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.court-h h1,.set-h h1{margin:0;font:700 24px var(--f-display);letter-spacing:.06em}
.court-h p,.set-h p{margin:4px 0 0;color:var(--fg2);max-width:62ch}
.case{border:1px solid var(--line);border-radius:14px;background:var(--bg2);margin-bottom:14px}
.case.hot{border-color:var(--bad)}
.case-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}
.case-h .t{flex:1 1 240px;min-width:0}
.case-h .t b{display:block;font:600 15.5px/1.4 var(--f-display);overflow-wrap:anywhere}
.case-h .t small{color:var(--fg2)}
.case-b{display:none;padding:0 16px 16px;gap:12px}
.case.open .case-b{display:grid}
.case.open .toggle .ic{transform:rotate(180deg)}

.topic.shown{animation:enterUp .65s cubic-bezier(.2,.8,.2,1) backwards}

.top{animation:dropIn .55s cubic-bezier(.2,.8,.2,1) backwards}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(var(--sp,0));transform-origin:0 50%;pointer-events:none}

.glow{position:fixed;left:0;top:0;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,var(--acc-glow),transparent);opacity:.7;will-change:transform;transform:translate3d(50vw,30vh,0)}

@media (min-width:901px){.side{animation:sideIn .55s cubic-bezier(.2,.8,.2,1) backwards}}

.brand svg path:nth-of-type(2){animation-delay:.4s}
.brand svg path:nth-of-type(3){animation-delay:.8s}
.brand svg circle{transform-box:fill-box;transform-origin:center;animation:dotIn .5s cubic-bezier(.3,1.6,.5,1) 1s backwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dotIn{from{transform:scale(0)}}
@keyframes spring{0%{opacity:0;transform:translateY(22px) scale(.94)}60%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{transform:none}}
.modal{animation:spring .42s cubic-bezier(.22,.9,.3,1) both}

.pop{transform-origin:100% 0}
@keyframes miIn{from{opacity:0;transform:translateX(8px)}}
.pop .mi{animation:miIn .26s cubic-bezier(.2,.8,.2,1) backwards}
.pop>:nth-child(2){animation-delay:.02s}.pop>:nth-child(3){animation-delay:.05s}.pop>:nth-child(4){animation-delay:.08s}.pop>:nth-child(5){animation-delay:.11s}.pop>:nth-child(6){animation-delay:.14s}.pop>:nth-child(7){animation-delay:.17s}

:root[data-motion="reduce"] *{animation-delay:0s!important}

<script>
/* 国库 DEBATE VAULT · Supabase 连接层（浏览器端）
 *
 * 用法：
 *   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>
 *   <script src="vault-api.js"><\/script>
 *   然后把你页面里原来读写 localStorage 的地方，换成下面的 VaultAPI.xxx()。
 *
 * 只需要改下面两行（Supabase 后台 → Project Settings → API）：
 *   - Project URL
 *   - anon / publishable key（可以公开，权限由数据库的 RLS 和函数保护）
 *   ！！绝对不要把 service_role / secret key 放进网页！！
 */
(function (global) {
  'use strict';

  var CFG = global.VAULT_CONFIG || {};
  var SUPABASE_URL = CFG.url || '';
  var SUPABASE_ANON_KEY = CFG.anonKey || '';
  var configured = !!(global.supabase && /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20);

  var sb = configured ? global.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;

  /* 数据库函数报错时，把 Postgres 的中文提示直接抛给界面用 toast 显示 */
  function ok(res) {
    if (res.error) { var e = new Error(res.error.message || '操作失败'); e.code = res.error.code; throw e; }
    return res.data;
  }
  function rpc(name, args) { return sb.rpc(name, args || {}).then(ok); }

  /* ---------- 登录 ---------- */
  var Auth = {
    /** 注册：用户名 + 邮箱 + 密码。用户名在数据库里唯一（不分大小写） */
    signUp: function (username, email, password) {
      username = String(username).trim();
      return rpc('username_available', { p_name: username }).then(function (free) {
        if (!free) throw new Error('该用户名已被使用，或格式不对（2–16 位字母、数字、下划线或中文）');
        return sb.auth.signUp({ email: email.trim(), password: password, options: { data: { username: username } } }).then(ok);
      }).then(function (d) {
        // 如果后台开着「Confirm email」，这里没有 session，要提示用户去邮箱点确认链接
        return { needsConfirm: !d.session };
      });
    },
    /** 登录：用邮箱 + 密码（传入的若不含 @ 仍会尝试按用户名查邮箱，界面上只开放邮箱） */
    signIn: function (login, password) {
      login = String(login).trim();
      var getEmail = login.indexOf('@') > -1 ? Promise.resolve(login) : rpc('login_email', { p_login: login });
      return getEmail.then(function (email) {
        if (!email) throw new Error('邮箱或密码错误');      // 故意不区分「用户不存在」和「密码错」
        return sb.auth.signInWithPassword({ email: email, password: password }).then(ok);
      }).catch(function (e) {
        throw new Error(/Invalid login|invalid_credentials/i.test(e.message) ? '邮箱或密码错误' : /not confirmed/i.test(e.message) ? '邮箱还没有确认，请先点邮件里的确认链接' : e.message);
      });
    },
    signOut: function () { return sb.auth.signOut(); },
    /** 登录状态变化（含刷新页面后的自动恢复）：cb(user | null) */
    onChange: function (cb) {
      sb.auth.getSession().then(function (r) { cb(r.data.session ? r.data.session.user : null); });
      return sb.auth.onAuthStateChange(function (_e, session) { cb(session ? session.user : null); });
    },
    /** 我的资料：{id, name, role, banned}；游客返回 null */
    profile: function () {
      return sb.auth.getUser().then(function (r) {
        var u = r.data && r.data.user; if (!u) return null;
        return sb.from('profiles').select('id,name,role,banned').eq('id', u.id).single().then(ok);
      });
    },
    updateName: function (name) { return rpc('update_my_name', { p_name: name }); }
  };

  /* ---------- 资料：读取并整理成你现有页面使用的形状 ---------- */
  function shape(r) {
    var votes = r.votes || [];
    return {
      id: r.id, topic: r.topic, content: r.content, domain: r.domain, form: r.form,
      year: r.year, month: r.month || null, day: r.day || null, srcName: r.src_name,
      src: r.src_type === 'url' ? { t: 'url', v: r.src_value } : { t: 'file', v: r.src_value, size: r.src_size || '' },
      author: r.author_name, ts: Date.parse(r.created_at),
      verified: r.verified, offline: r.offline,
      up: votes.filter(function (v) { return v.value === 1; }).map(function (v) { return v.user_id; }),   // 注意：现在是用户 id，不是名字
      down: votes.filter(function (v) { return v.value === -1; }).map(function (v) { return v.user_id; }),
      appealCount: r.appeal_count,                                    // 所有人可见（游客也能看到「被上诉」标签）
      appeals: (r.appeals || []).map(function (a) {                   // 只有本人和管理员能读到明细
        return { user: a.user_name, userId: a.user_id, reason: a.reason, ts: Date.parse(a.created_at) };
      }),
      versions: (r.entry_versions || []).sort(function (a, b) { return a.v - b.v; }).map(function (v) {
        return { v: v.v, ts: Date.parse(v.created_at), user: v.user_name, topic: v.topic, content: v.content,
                 year: v.year, month: v.month || null, day: v.day || null, srcName: v.src_name, note: v.note };
      })
    };
  }

  var Data = {
    /** 一次读完全部资料（10–100 人规模、几百到几千条资料完全够用） */
    loadEntries: function () {
      return sb.from('entries')
        .select('*, entry_versions(*), votes(user_id,value), appeals(user_id,user_name,reason,created_at)')
        .order('created_at', { ascending: false })
        .limit(5000).then(ok).then(function (rows) { return rows.map(shape); });
    },
    addEntry: function (e) {
      return rpc('add_entry', {
        p_topic: e.topic, p_content: e.content, p_domain: e.domain, p_form: e.form, p_year: e.year, p_month: e.month || null, p_day: e.day || null,
        p_src_name: e.srcName, p_src_type: e.src.t, p_src_value: e.src.v, p_src_size: e.src.size || null
      });
    },
    editEntry: function (id, e, note) {
      return rpc('edit_entry', { p_id: id, p_topic: e.topic, p_content: e.content, p_year: e.year, p_month: e.month || null, p_day: e.day || null, p_src_name: e.srcName, p_note: note });
    },
    vote: function (id, value) { return rpc('cast_vote', { p_entry: id, p_value: value }); },  // 1 赞 / -1 踩，再点同一个＝取消
    appeal: function (id, reason) { return rpc('file_appeal', { p_entry: id, p_reason: reason }); },
    withdraw: function (id) { return rpc('withdraw_appeal', { p_entry: id }); },
    /** 输入授权密钥提权；成功返回新身份，密钥无效返回 null */
    redeemKey: function (key) { return rpc('redeem_key', { p_key: key }); },
    lowerMyRole: function (role) { return rpc('lower_my_role', { p_role: role }); }
  };

  /* ---------- 备战夹（所有贡献者共享；直接读写表，RLS 保证只有贡献者+能用） ---------- */
  var War = {
    /** 返回你页面现在用的形状：{motions:[{id,name,active,by,ts,items:{标题:{ids:[],ts,by}}}]} */
    load: function () {
      return Promise.all([
        sb.from('motions').select('*').order('created_at').then(ok),
        sb.from('motion_items').select('*').then(ok)
      ]).then(function (r) {
        return { v: 1, motions: r[0].map(function (m) {
          var items = {};
          r[1].filter(function (i) { return i.motion_id === m.id; }).forEach(function (i) {
            items[i.topic] = { ids: i.entry_ids, ts: Date.parse(i.updated_at), by: i.added_by };
          });
          return { id: m.id, name: m.name, active: m.active, by: m.created_by_name, ts: Date.parse(m.created_at), items: items };
        }) };
      });
    },
    createMotion: function (name, myId, myName) {
      return sb.from('motions').insert({ name: name, created_by: myId, created_by_name: myName }).select().single().then(ok);
    },
    renameMotion: function (id, name) { return sb.from('motions').update({ name: name }).eq('id', id).then(ok); },
    setActive: function (id, active) { return sb.from('motions').update({ active: active }).eq('id', id).then(ok); },
    deleteMotion: function (id) { return sb.from('motions').delete().eq('id', id).then(ok); },
    /** 加入 / 更新某个数据标题下选中的论据 */
    saveItem: function (motionId, topic, ids, myName) {
      return sb.from('motion_items').upsert(
        { motion_id: motionId, topic: topic, entry_ids: ids, added_by: myName, updated_at: new Date().toISOString() },
        { onConflict: 'motion_id,topic' }).then(ok);
    },
    removeItem: function (motionId, topic) {
      return sb.from('motion_items').delete().eq('motion_id', motionId).eq('topic', topic).then(ok);
    }
  };

  /* ---------- 管理员 ---------- */
  var Admin = {
    users: function () { return rpc('admin_list_users'); },
    setRole: function (userId, role) { return rpc('admin_set_role', { p_user: userId, p_role: role }); },
    setBanned: function (userId, banned) { return rpc('admin_set_banned', { p_user: userId, p_banned: banned }); },
    keys: function () { return rpc('admin_list_keys'); },
    /** 返回密钥明文——只此一次，之后数据库里只剩哈希，请当场复制 */
    createKey: function (label, role, maxUses, days) {
      return rpc('admin_create_key', { p_label: label, p_role: role, p_max_uses: maxUses || null, p_days: days || null });
    },
    revokeKey: function (id) { return rpc('admin_revoke_key', { p_id: id }); },
    verify: function (id, v) { return rpc('admin_set_verified', { p_id: id, p_value: v }); },
    offline: function (id, v) { return rpc('admin_set_offline', { p_id: id, p_value: v }); },
    courtPass: function (id) { return rpc('court_pass', { p_id: id }); },
    courtReject: function (id) { return rpc('court_reject', { p_id: id }); },
    courtLog: function () { return sb.from('court_log').select('*').order('created_at', { ascending: false }).limit(30).then(ok); },
    adminLog: function () { return sb.from('admin_log').select('*').order('created_at', { ascending: false }).limit(100).then(ok); },
    /** 把旧版导出的 JSON（{entries:[...]}）里的 entries 数组导入；返回成功条数 */
    importEntries: function (entries) { return rpc('admin_import_entries', { p_data: entries }); }
  };

  /* ---------- 实时同步：任何人改了数据，所有打开着页面的人几百毫秒内收到通知 ---------- */
  function subscribe(onChange) {
    var t = 0;
    function ping() { clearTimeout(t); t = setTimeout(onChange, 300); }   // 合并短时间内的多次变化
    var ch = sb.channel('vault-changes');
    ['entries', 'entry_versions', 'votes', 'appeals', 'motions', 'motion_items', 'profiles', 'court_log'].forEach(function (table) {
      ch.on('postgres_changes', { event: '*', schema: 'public', table: table }, ping);
    });
    ch.subscribe();
    return function () { sb.removeChannel(ch); };
  }

  global.VaultAPI = { configured: configured, sb: sb, Auth: Auth, Data: Data, War: War, Admin: Admin, subscribe: subscribe };
})(window);

</script>
<script>
(function(){

var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ---------- storage ---------- */

var DMAP={'选举与政治':'政治与选举','政治与国际关系':'国家与国际关系','国家':'国家与国际关系','经济发展':'经济发展与金融','经济与金融':'经济发展与金融','正义':'公平与正义','公平与公正':'公平与正义','教育与青年':'教育与校园','科技':'科技与人工智能','人工智能':'科技与人工智能','心理':'心理与行为','媒体/社交媒体':'媒体与文化','文化与传媒':'媒体与文化'};

function normCat(e){if(DMAP[e.domain])e.domain=DMAP[e.domain];if(FMAP[e.form])e.form=FMAP[e.form];if(e.year===undefined)e.year=null;if(e.month===undefined)e.month=null;if(e.day===undefined)e.day=null;if(e.srcName===undefined)e.srcName=''}
/* year is required; month and day are optional (day needs a month) */
function fdate(o){return o.year?o.year+' 年'+(o.month?' '+o.month+' 月'+(o.day?' '+o.day+' 日':''):''):''}

function dateRow(p,o,ph){

function readDate(p){
  var yr=parseInt($('#'+p+'-year').value,10),mo=$('#'+p+'-month').value,dy=$('#'+p+'-day').value;
  if(!isFinite(yr)||yr<1900||yr>YMAX)return {err:'请填写论据年份（1900–'+YMAX+'）'};
  var m=mo===''?null:+mo,d=dy===''?null:+dy;
  if(d!==null&&m===null)return {err:'填写日期前请先选择月份'};
  if(d!==null&&d>new Date(yr,m,0).getDate())return {err:yr+' 年 '+m+' 月没有 '+d+' 日'};
  return {year:yr,month:m,day:d};
}
var ROLE={visitor:'游客',member:'普通会员',contributor:'授权贡献者',admin:'官方管理员',banned:'已限制'};

var DAY=864e5, LIMIT=3, YMAX=new Date().getFullYear();
var VORDER=['hall','war','court','admin','settings'];
var PALETTES=[
  {id:'auto',name:'自动配对',desc:'夜间黑曜蓝，白天暖沙色'},
  {id:'obsidian',name:'黑曜蓝',desc:'沉静的深蓝灰底，青灰点缀',h:222,s:24,ha:196,as:42},
  {id:'sand',name:'暖沙',desc:'低蓝光暖色，纸张般柔和',h:36,s:20,ha:30,as:40},
  {id:'moss',name:'苔绿',desc:'灰绿底色，最不刺眼',h:140,s:14,ha:150,as:30},
  {id:'dusk',name:'暮紫',desc:'灰紫底色，安静内敛',h:268,s:16,ha:285,as:32},
  {id:'graphite',name:'石墨灰',desc:'近中性灰，色彩干扰最小',h:210,s:7,ha:205,as:26},
  {id:'pine',name:'松青',desc:'深青灰底，清爽耐看',h:184,s:18,ha:172,as:34}
];
var ACCENTS=[{n:'青',h:192},{n:'绿',h:150},{n:'琥珀',h:34},{n:'玫瑰',h:350},{n:'紫',h:270},{n:'蓝',h:215}];

var ICONS={
  up:'M12 19V5M5 12l7-7 7 7',down:'M12 5v14M19 12l-7 7-7-7',lock:'M7 11V8a5 5 0 0110 0v3M5 11h14v10H5z',
  plus:'M12 5v14M5 12h14',chev:'M6 9l6 6 6-6',
  link:'M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1',
  file:'M14 3H6v18h12V7zM14 3v4h4',check:'M5 12l5 5 9-10',close:'M6 6l12 12M18 6L6 18',
  scale:'M12 3v18M5 21h14M4 7h16M7 7l-3 7a3 3 0 006 0zM17 7l-3 7a3 3 0 006 0z',copy:'M9 9h11v12H9zM5 15V3h11',
  clock:'M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',
  flag:'M5 21V4M5 4h11l-2 4 2 4H5',undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',
  off:'M4 4l16 16M10.6 6.1A8 8 0 0120 12a12 12 0 01-2.2 3M6.5 7.5A12 12 0 004 12c1.6 3.4 4.7 6 8 6a8 8 0 003-.6',
  menu:'M4 6h16M4 12h16M4 18h16',
  users:'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21a7 7 0 0114 0M16 3.1a4 4 0 010 7.8M22 21a7 7 0 00-5-6.7',folder:'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z',download:'M12 3v12M7 10l5 5 5-5M5 21h14',trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14',
  gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z'
};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICONS[n]+'"/></svg>'}
var DOTS='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';

/* ---------- state ---------- */
/* Everything shared lives in Supabase. DB / WAR below are in-memory copies of what the server last returned;
   all writes go through window.VaultAPI (see the vault-api block above) and then the copies are refreshed. */
var API=window.VaultAPI,ONLINE=!!(API&&API.configured);
var DB={entries:[],court:[]};
var WAR={v:1,motions:[]};
var ME=null;                 /* {id,name,role,banned,email} of the signed-in user, or null for a visitor */
var ADM={users:null,keys:null,log:null,err:null,busy:false};
var P=store.get('dv_prefs',null)||{};
P={mode:P.mode||'system',palette:P.palette||'auto',accent:(typeof P.accent==='number')?P.accent:null,motion:P.motion||'auto'};
var ui={view:'hall',q:'',dom:null,form:null,sort:'new',collapsed:{},side:{dom:true,form:true},courtOpen:{},popKey:null,tok:0,warSel:null,warDraft:{},ready:false,loadErr:null,welcome:null};
function savePrefs(){store.set('dv_prefs',P)}
function cu(){return ME}
function role(){return !ME?'visitor':ME.banned?'banned':ME.role}
function rk(){return RANK[role()]}
function apn(e){return e.appealCount||0}
function errMsg(e){var m=e&&e.message?String(e.message):'';return m||'操作失败，请稍后再试'}

/* ---------- loading from the server ---------- */
var curUser=null,lastUid=undefined;
async function loadProfile(user){
  curUser=user||null;
  if(!user){ME=null;return}
  try{var p=await API.Auth.profile();ME=p?{id:p.id,name:p.name,role:p.role,banned:!!p.banned,email:user.email||''}:null}
  catch(e){ME=null}
}
async function loadData(){
  var r=await Promise.all([
    API.Data.loadEntries(),
    role()==='admin'?API.Admin.courtLog().catch(function(){return []}):Promise.resolve([]),
    rk()>=2?API.War.load().catch(function(){return null}):Promise.resolve(null)
  ]);
  DB.entries=r[0];DB.entries.forEach(normCat);
  DB.court=r[1].map(function(c){return {ts:Date.parse(c.created_at),action:c.action,topic:c.topic,snip:c.snip,n:c.n,admin:c.admin_name}});
  WAR=r[2]||{v:1,motions:[]};
}
var loadP=null,loadAgain=false;
/* One load at a time; a request that arrives mid-load queues exactly one more load. The returned promise resolves when the data is current. */
function refresh(){
  if(!ONLINE)return Promise.resolve();
  if(loadP){loadAgain=true;return loadP}
  loadP=(async function(){
    do{
      loadAgain=false;
      try{await loadData();ui.loadErr=null}catch(e){ui.loadErr=errMsg(e)}
      var first=!ui.ready;ui.ready=true;
      softRender(first);
      if(ui.view==='admin'&&role()==='admin')loadAdmin(true);
    }while(loadAgain);
  })().then(function(){loadP=null},function(){loadP=null});
  return loadP;
}
/* Re-render after a data change without clobbering what the person is typing in Settings. */
function softRender(first){
  if(ui.view==='settings'){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#v-settings').contains(a))return}
  if(ui.view==='hall'&&!first&&!rm())flipHall(render);else render();
  if(first&&ui.view==='hall')playEnter();
}
async function afterRoleChange(){
  await loadProfile(curUser);
  await refresh();
}
function onAuthUser(user){
  var uid=user?user.id:null;
  if(uid===lastUid&&ui.ready)return;          /* tab refocus / token refresh: nothing changed */
  lastUid=uid;
  (async function(){
    await loadProfile(user);
    if(ui.view==='court'&&role()!=='admin'||ui.view==='admin'&&role()!=='admin'||ui.view==='war'&&rk()<2){ui.view='hall';syncViewVisibility()}
    await refresh();
    if(ui.welcome&&ME){toast((ui.welcome==='register'?'注册成功，':'欢迎回来，')+ME.name+'（'+ROLE[role()]+'）','ok')}
    ui.welcome=null;
  })();
}

/* ---------- theme ---------- */
function effDark(){
  if(P.mode==='dark')return true;if(P.mode==='light')return false;
  try{return !matchMedia('(prefers-color-scheme: light)').matches}catch(e){return true}
}
function palById(id){return PALETTES.filter(function(p){return p.id===id})[0]}
function resolvedPalette(){return P.palette==='auto'?(effDark()?'obsidian':'sand'):P.palette}
function applyTheme(){
  var root=document.documentElement;
  if(P.mode==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',P.mode);
  root.setAttribute('data-palette',resolvedPalette());
  if(P.accent!==null)root.style.setProperty('--ha',String(P.accent));else root.style.removeProperty('--ha');
  root.setAttribute('data-motion',P.motion);
}
function hsl(h,s,l){return 'hsl('+h+' '+s+'% '+l+'%)'}
function swatch(p){
  var d=effDark(),ha=P.accent!==null?P.accent:p.ha;
  return d?{bg:hsl(p.h,p.s,9),bg3:hsl(p.h,p.s,17),line:hsl(p.h,p.s*.8,26),acc:hsl(ha,p.as,66),acc2:hsl(ha+55,p.as*.8,70)}
          :{bg:hsl(p.h,p.s*1.3,90),bg3:hsl(p.h,p.s*1.25,83),line:hsl(p.h,p.s,72),acc:hsl(ha,p.as+8,32),acc2:hsl(ha+55,p.as*.8,38)};
}

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function fmt(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function fsize(b){return b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function snip(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}
function toast(msg,kind,ms){
  var el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;$('#toasts').appendChild(el);
  var gone=false;
  function leave(){if(gone)return;gone=true;el.classList.add('out');setTimeout(function(){el.remove()},rm()?0:230)}
  var t=setTimeout(leave,ms||2800);el.kill=function(){clearTimeout(t);leave()};return el;
}

/* ---------- permissions ---------- */
function need(min,what){
  if(rk()>=RANK[min])return true;
  denyDlg(min,what);
  return false;
}
function denyDlg(min,what){
  var r=role(),msg=r==='visitor'
    ?'游客仅可浏览资料。登录'+(min==='member'?'':'并提权至「'+ROLE[min]+'」')+'后才能'+what+'。'
    :r==='banned'?'你的账户已被管理员限制，目前只能浏览资料，不能'+what+'。如有疑问请联系管理员。'
    :'「'+what+'」需要「'+ROLE[min]+'」或更高权限，你当前是「'+ROLE[r]+'」。可在设置中输入授权密钥提权。';
  modal({title:'权限不足',
    body:'<div class="note">'+esc(msg)+'</div>',
    actions:[{label:'知道了'},{label:'前往设置',cls:'pri',fn:function(){setTimeout(gotoSettings,0)}}]});
}

/* ---------- search / filter ---------- */
function tokens(){return ui.q.trim().toLowerCase().split(/\s+/).filter(Boolean)}
function subseq(t,h){var i=0;for(var j=0;j<h.length&&i<t.length;j++)if(h[j]===t[i])i++;return i===t.length}
function matchQ(e){
  var ts=tokens();if(!ts.length)return true;
  var full=(e.topic+' '+e.content+' '+e.domain+' '+e.form+' '+e.author+' '+fdate(e)+' '+(e.srcName||'')).toLowerCase();
  var short=(e.topic+' '+e.domain+' '+e.form).toLowerCase();
  return ts.every(function(t){return full.indexOf(t)>-1||(t.length>=2&&subseq(t,short))});
}
function hl(text){
  var s=esc(text),ts=tokens().map(function(t){return esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});
  if(!ts.length)return s;
  return s.replace(new RegExp(ts.join('|'),'gi'),function(m){return '<mark>'+m+'</mark>'});
}
function visible(){return DB.entries.filter(function(e){return !e.offline||role()==='admin'})}
function filtered(){return visible().filter(function(e){return (!ui.dom||e.domain===ui.dom)&&(!ui.form||e.form===ui.form)&&matchQ(e)})}
function score(e){return e.up.length-e.down.length}
function sortE(a){
  var s=ui.sort;
  return a.slice().sort(function(x,y){
    if(s==='hot')return score(y)-score(x)||y.ts-x.ts;
    if(s==='year')return dkey(y)-dkey(x)||y.ts-x.ts;
    return y.ts-x.ts;
  });
}
function groups(list){
  var m={},order=[];
  list.forEach(function(e){if(!m[e.topic]){m[e.topic]=[];order.push(e.topic)}m[e.topic].push(e)});
  var gs=order.map(function(t){return {t:t,a:sortE(m[t])}});
  var key=function(g){
    if(ui.sort==='hot')return g.a.reduce(function(s,e){return s+score(e)},0);
    if(ui.sort==='year')return Math.max.apply(null,g.a.map(dkey))*1e4+Math.max.apply(null,g.a.map(function(e){return e.ts}))/1e9;
    return Math.max.apply(null,g.a.map(function(e){return e.ts}));
  };
  return gs.sort(function(x,y){return key(y)-key(x)});
}

function syncViewVisibility(){VORDER.forEach(function(v){var el=$('#v-'+v);el.hidden=ui.view!==v;el.classList.remove('in-l','in-r','out-l','out-r')})}
function setView(v){
  if((v==='court'||v==='admin')&&role()!=='admin')v='hall';
  if(v==='war'&&rk()<2){denyDlg('contributor','使用备战夹');return}

  syncViewVisibility();
  var from=$('#v-'+ui.view),to=$('#v-'+v),dir=VORDER.indexOf(v)>VORDER.indexOf(ui.view)?'l':'r',tok=++ui.tok;
  ui.view=v;render();

  $('#side').classList.remove('open');$('#scrim').classList.remove('show');
  from.classList.add('out-'+dir);
  setTimeout(function(){
    if(tok!==ui.tok)return;
    from.hidden=true;from.classList.remove('out-l','out-r');
    to.hidden=false;to.classList.add('in-'+dir);
    window.scrollTo({top:0});
    if(v==='hall')playEnter();
    if(v==='court')$$('#v-court [data-n]').forEach(countUp);
    if(v==='admin')loadAdmin();

      $$('#v-'+v+' .panel,#v-'+v+' .case').forEach(function(p,i){p.style.setProperty('--i',Math.min(i,8));p.classList.add('enterp')});
      setTimeout(function(){$$('.enterp').forEach(function(p){p.classList.remove('enterp')})},1400);

  },190);
}

function openAuth(tab){
  var reg=tab==='register';
  modal({title:reg?'注册账户':'登录国库',
    body:(reg
      ?'<div class="field"><label for="a-u">用户名</label><input class="in" id="a-u" autocomplete="username" maxlength="16" placeholder="2–16 位，支持中文；会显示给其他人"></div>'+
       '<div class="field"><label for="a-m">邮箱</label><input class="in" id="a-m" type="email" autocomplete="email" placeholder="name@example.com"></div>'
      :'<div class="field"><label for="a-m">邮箱</label><input class="in" id="a-m" type="email" autocomplete="email" placeholder="注册时填的邮箱"></div>')+
      '<div class="field"><label for="a-p">密码</label><input class="in" id="a-p" type="password" autocomplete="'+(reg?'new-password':'current-password')+'" placeholder="至少 6 位"></div>'+
      (reg?'<div class="field"><label for="a-c">确认密码</label><input class="in" id="a-c" type="password" autocomplete="new-password"></div>':'')+
      '<div class="err" id="a-e" role="alert"></div>'+
      '<div class="hint">'+(reg?'注册后默认为「普通会员」，可在设置中用授权密钥提权。':'')+(reg?'<br>已有账户？<a href="#" data-act="auth-switch" data-v="login">去登录</a>':'还没有账户？<a href="#" data-act="auth-switch" data-v="register">立即注册</a>')+'</div>',
    actions:[{label:'取消'},{label:reg?'注册':'登录',cls:'pri',keep:true,fn:function(btn){
      var u=reg?$('#a-u').value.trim():'',p=$('#a-p').value,err=$('#a-e');
      function bad(m){err.textContent=m;return false}
      if(!ONLINE)return bad('网站还没有连接数据库：请先按页面上的提示填好 Supabase 的网址和 key');
      var mail=$('#a-m').value.trim();
      if(reg){
        if(!/^[\w一-龥-]{2,16}$/.test(u))return bad('用户名需为 2–16 位的字母、数字、下划线或中文');
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return bad('请输入有效的邮箱地址');
        if(p.length<6)return bad('密码至少 6 位');
        if(p!==$('#a-c').value)return bad('两次输入的密码不一致');
      }else{
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return bad('请输入注册时用的邮箱地址');
        if(!p)return bad('请输入密码');
      }
      err.textContent='';btn.disabled=true;
      (async function(){
        try{
          ui.welcome=reg?'register':'login';
          if(reg){
            var r=await API.Auth.signUp(u,mail,p);
            if(r.needsConfirm){
              ui.welcome=null;closeModal();
              modal({title:'请先确认邮箱',body:'<div class="note">确认邮件已发送到 <b>'+esc(mail)+'</b>。点开邮件里的链接确认后，回到这里用邮箱和密码登录即可。没收到的话请看垃圾邮件箱。</div>',actions:[{label:'知道了',cls:'pri'}]});
              return;
            }
          }else await API.Auth.signIn(mail,p);
          closeModal();
        }catch(e){ui.welcome=null;btn.disabled=false;bad(errMsg(e))}
      })();
      return false;
    }}]});
}

/* ---------- war folder (备战夹) ----------
   Shared by every contributor-or-above through the database (tables motions / motion_items, realtime).
   WAR is the in-memory copy: { motions:[ {id,name,active,by,ts, items:{ <数据标题>:{ids:[entryId…],ts,by} } } ] }.
   It only stores references to entries, never copies, so nothing here changes the hall or the entries table. */
function wcatch(er){toast(errMsg(er),'bad',4200);refresh()}

function actM(){return WAR.motions.filter(function(m){return m.active})}
function warM(id){return WAR.motions.filter(function(m){return m.id===id})[0]}
function selM(){var m=warM(ui.warSel);if(!m){m=actM()[0]||WAR.motions[0]||null;ui.warSel=m?m.id:null}return m}
function topicIds(t){return DB.entries.filter(function(e){return e.topic===t&&!e.offline}).map(function(e){return e.id})}
function orderIds(ids){var s={};ids.forEach(function(i){s[i]=1});return DB.entries.filter(function(e){return s[e.id]}).map(function(e){return e.id})}
function liveIds(m,t){
  var it=m.items[t];if(!it)return [];
  var ok={};DB.entries.forEach(function(e){if(e.topic===t&&!e.offline)ok[e.id]=1});
  return it.ids.filter(function(i){return ok[i]});
}
function sameSet(a,b){if(a.length!==b.length)return false;var s={};a.forEach(function(i){s[i]=1});return b.every(function(i){return s[i]})}
function curIds(m,t){var d=ui.warDraft[m.id];return d&&d[t]?d[t]:liveIds(m,t)}
function setDraft(m,t,arr){var d=ui.warDraft[m.id]||(ui.warDraft[m.id]={});d[t]=arr}
function dropDraft(m,t){var d=ui.warDraft[m.id];if(d)delete d[t]}
function isDirty(m){var d=ui.warDraft[m.id];return !!d&&Object.keys(d).some(function(t){return m.items[t]&&!sameSet(d[t],liveIds(m,t))})}
function mStats(m){var k=Object.keys(m.items),n=0;k.forEach(function(t){n+=liveIds(m,t).length});return {t:k.length,n:n}}
function addTo(m,t){var ids=topicIds(t);m.items[t]={ids:ids,ts:Date.now(),by:cu().name};return API.War.saveItem(m.id,t,ids,cu().name)}

/* hall: the 备战 button on each data title */
function warBtn(t){
  var locked=rk()<2,n=locked?0:actM().filter(function(m){return m.items[t]}).length;
  return '<button class="btn sm keep war-btn'+(n?' on':'')+'" data-act="war-add" data-t="'+esc(t)+'" aria-pressed="'+(n>0)+'" title="'+(locked?'备战夹仅授权贡献者及以上可用':n?'再点一次取消备战':'加入备战夹')+'">'+
    ic(locked?'lock':n?'check':'folder')+'<span class="lbl">'+(n?'已备战'+(n>1?' · '+n:''):'备战')+'</span></button>';
}
function refreshWarBtns(){$$('#v-hall .war-btn').forEach(function(b){b.outerHTML=warBtn(b.dataset.t)})}
function warToggle(t){
  if(!need('contributor','使用备战夹'))return;
  var act=actM();
  if(!act.length){
    modal({title:'还没有正在备战的辩题',body:'<div class="note">先到备战夹新建（或恢复）一个正在备战的辩题，再回到数据大厅点击数据标题上的「备战」。</div>',
      actions:[{label:'稍后'},{label:'前往备战夹',cls:'pri',fn:function(){setTimeout(function(){setView('war')},0)}}]});
    return;
  }
  if(act.length>1){openWarPick(t,act);return}
  var m=act[0];
  if(m.items[t]){delete m.items[t];dropDraft(m,t);refreshWarBtns();toast('已从「'+m.name+'」备战夹取消');API.War.removeItem(m.id,t).catch(wcatch)}
  else{var pr=addTo(m,t);refreshWarBtns();toast('已加入「'+m.name+'」备战夹','ok');pr.catch(wcatch)}
}
function openWarPick(t,act){
  modal({title:'加入备战夹',
    body:'<div class="note"><b>'+esc(t)+'</b><br>勾选要加入的备战辩题（可多选）；取消勾选即从该辩题的备战夹中移除。</div><div class="wpick">'+
      act.map(function(m){return '<label class="wp"><input type="checkbox" value="'+m.id+'"'+(m.items[t]?' checked':'')+'><span>'+esc(m.name)+'</span></label>'}).join('')+'</div>',
    actions:[{label:'取消'},{label:'确定',cls:'pri',fn:function(){
      var na=0,nr=0,ps=[];
      $$('.wp input',$('#ov')).forEach(function(c){
        var m=warM(c.value);if(!m)return;
        if(c.checked&&!m.items[t]){ps.push(addTo(m,t));na++}
        else if(!c.checked&&m.items[t]){delete m.items[t];dropDraft(m,t);ps.push(API.War.removeItem(m.id,t));nr++}
      });
      if(na||nr){Promise.all(ps).catch(wcatch);refreshWarBtns();toast((na?'已加入 '+na+' 个备战夹':'')+(na&&nr?'，':'')+(nr?'已从 '+nr+' 个备战夹取消':''),'ok')}
    }}]});
}

  var d=isDirty(m),keys=Object.keys(m.items);
  var h='<div class="wbar"><div class="wbar-t"><b>'+esc(m.name)+'</b><span class="hint">'+(m.active?'备战中':'已结束')+' · 由 '+esc(m.by||'—')+' 创建于 '+fmt(m.ts)+'</span></div><div class="ctl">'+

  else h+=keys.map(function(t){return warTopicHTML(m,t)}).join('');

    case 'clearq':ui.q='';$('#q').value='';flipHall(render);break;
    case 'sidetoggle':ui.side[t.dataset.g]=!ui.side[t.dataset.g];renderSide();break;
    case 'drawer':$('#side').classList.toggle('open');$('#scrim').classList.toggle('show');break;
    case 'view':setView(t.dataset.v);break;
    case 'settings':setView(ui.view==='settings'?'hall':'settings');break;
    case 'auth':openAuth('login');break;
    case 'auth-reg':openAuth('register');break;
    case 'auth-switch':ev.preventDefault();closeModal();openAuth(t.dataset.v);break;
    case 'new':openNew();break;
    case 'mclose':closeModal();break;
    case 'logout':doLogout();break;
    case 'reload':refresh().then(function(){toast('数据已刷新','ok')});break;
    case 'name-go':saveMyName();break;
    case 'key-go':redeemKey();break;
    case 'down':lowerRole(t.dataset.v);break;
    case 'mode-set':{var mv=t.dataset.v;withThemeTransition(ev,function(){P.mode=mv;savePrefs();applyTheme();render()});break}
    case 'pal':{var pv=t.dataset.v;withThemeTransition(ev,function(){P.palette=pv;savePrefs();applyTheme();render()});break}
    case 'acc':{var av=t.dataset.v===''?null:+t.dataset.v;withThemeTransition(ev,function(){P.accent=av;savePrefs();applyTheme();render()});break}
    case 'motion':P.motion=t.dataset.v;savePrefs();applyTheme();render();break;
    case 'b-copy':copyText($('#b-out').value,'已复制 JSON');break;
    case 'b-import':importData();break;
    case 'adm-reload':loadAdmin();break;
    case 'adm-ban':{var bn=t.dataset.n,bv=t.dataset.v==='1';
      confirmDlg(bv?'限制账户':'解除限制',bv?'限制「'+esc(bn)+'」后，他仍可浏览资料，但不能点赞、录入、上诉或使用备战夹。':'解除对「'+esc(bn)+'」的限制，恢复原来的身份与权限。',bv?'确认限制':'确认解除',bv,function(){
        API.Admin.setBanned(id,bv).then(function(){toast(bv?'已限制该账户':'已解除限制','ok');return loadAdmin(true)}).catch(admError)});break}
    case 'adm-key-new':admNewKey();break;
    case 'adm-key-revoke':{var kn=t.dataset.n;confirmDlg('作废密钥','作废后「'+esc(kn)+'」这个密钥立刻失效，已经用它提权的人不受影响。','确认作废',true,function(){
        API.Admin.revokeKey(id).then(function(){toast('密钥已作废','ok');return loadAdmin(true)}).catch(admError)});break}
    case 'menu':{
      if(!e)break;var key='menu'+id;
      if(ui.popKey===key){closePop();break}
      closePop();t.setAttribute('aria-expanded','true');openPop(t,menuHTML(e),key);break}
    case 'm-edit':openEdit(e);break;
    case 'm-appeal':openAppeal(e);break;
    case 'm-withdraw':doWithdraw(e);break;
    case 'm-copy':copyText('「'+e.topic+'」'+snip(e.content,60)+'｜'+(e.year?fdate(e)+'｜':'')+'来源：'+(e.srcName?e.srcName+'，':'')+(e.src.t==='url'?e.src.v:e.src.v+'（文献文件）')+'｜录入：'+e.author+' '+fmt(e.ts)+'｜国库 DEBATE VAULT','已复制引用格式');break;
    case 'm-verify':{var nv=!e.verified;e.verified=nv;render();API.Admin.verify(id,nv).then(function(){toast(nv?'已标记为官方已核实':'已取消官方核实','ok')}).catch(function(er){e.verified=!nv;render();toast(errMsg(er),'bad')});break}
    case 'm-offline':{var no=!e.offline;e.offline=no;render();API.Admin.offline(id,no).then(function(){toast(no?'资料已下架，普通用户不可见':'资料已重新上架','ok')}).catch(function(er){e.offline=!no;render();toast(errMsg(er),'bad')});break}
    case 'vote':{
      if(!need('member','点赞或点踩'))break;
      var me=cu().id,k2=t.dataset.v,o=k2==='up'?'down':'up';
      var had=e[k2].indexOf(me)>-1;
      e[o]=e[o].filter(function(x){return x!==me});
      e[k2]=e[k2].filter(function(x){return x!==me});
      if(!had)e[k2].push(me);
      render();afterVote(id,k2,!had);
      API.Data.vote(id,k2==='up'?1:-1).catch(function(er){toast(errMsg(er),'bad');refresh()});break}
    case 'hist':openHist(e);break;
    case 'dl':simDownload(e);break;
    case 'war-add':warToggle(t.dataset.t);break;
    case 'war-new':openWarName(null);break;
    case 'war-rename':{var rm1=warM(id);if(rm1)openWarName(rm1);break}
    case 'war-pick':ui.warSel=id;renderWar();break;
    case 'war-toggle':{var tm=warM(id);if(!tm||!need('contributor','管理备战辩题'))break;tm.active=!tm.active;API.War.setActive(tm.id,tm.active).catch(wcatch);renderWar();toast(tm.active?'已恢复备战':'已结束备战，数据大厅不再向它加入','ok');break}
    case 'war-del':{var dm=warM(id);if(!dm||!need('contributor','管理备战辩题'))break;
      confirmDlg('删除备战辩题','将删除「'+esc(dm.name)+'」及其备战夹内的全部选择（所有人共用，不可恢复）。数据大厅与数据库里的资料不受影响。','确认删除',true,function(){
        WAR.motions=WAR.motions.filter(function(x){return x!==dm});delete ui.warDraft[dm.id];if(ui.warSel===dm.id)ui.warSel=null;API.War.deleteMotion(dm.id).catch(wcatch);renderWar();toast('已删除备战辩题','ok')});break}
    case 'war-chk':{var cm=selM();if(!cm||!need('contributor','使用备战夹')){renderWar();break}
      var ct=t.dataset.t,arr=curIds(cm,ct).slice(),ix=arr.indexOf(id);
      if(t.checked&&ix<0)arr.push(id);else if(!t.checked&&ix>-1)arr.splice(ix,1);
      setDraft(cm,ct,arr);renderWar();focusChk(ct,id);break}
    case 'war-all':{var am=selM();if(!am||!need('contributor','使用备战夹'))break;setDraft(am,t.dataset.t,topicIds(t.dataset.t));renderWar();break}
    case 'war-none':{var nm0=selM();if(!nm0||!need('contributor','使用备战夹'))break;setDraft(nm0,t.dataset.t,[]);renderWar();break}
    case 'war-drop':{var pm=selM(),pt=t.dataset.t;if(!pm||!need('contributor','使用备战夹'))break;
      confirmDlg('移出备战夹','将「'+esc(pt)+'」从「'+esc(pm.name)+'」备战夹中移出，该标题下已选的论据也会一并清除。数据大厅里的资料不受影响。','确认移出',true,function(){
        delete pm.items[pt];dropDraft(pm,pt);API.War.removeItem(pm.id,pt).catch(wcatch);renderWar();toast('已移出备战夹','ok')});break}
    case 'war-save':{var sm=selM();if(!sm||!need('contributor','保存备战夹'))break;
      var dd=ui.warDraft[sm.id]||{},ps=[];Object.keys(dd).forEach(function(k){if(sm.items[k]){sm.items[k].ids=orderIds(dd[k]);ps.push(API.War.saveItem(sm.id,k,sm.items[k].ids,cu().name))}});
      delete ui.warDraft[sm.id];Promise.all(ps).catch(wcatch);renderWar();toast('备战夹已保存','ok');break}
    case 'war-discard':{var xm=selM();if(xm){delete ui.warDraft[xm.id];renderWar();toast('已放弃未保存的修改')}break}
    case 'war-export':{var em=warM(id);if(em&&need('contributor','导出 Word'))exportWord(em);break}
    case 'court-open':ui.courtOpen[id]=!ui.courtOpen[id];renderCourt();break;
    case 'court-pass':courtPass(e);break;
    case 'court-reject':courtReject(e);break;
  }
});
$('#v-hall').addEventListener('change',function(ev){if(ev.target.id==='sort'){ui.sort=ev.target.value;flipHall(renderHall)}});
$('#v-admin').addEventListener('change',function(ev){
  var t=ev.target;if(!t.dataset||t.dataset.act!=='adm-role')return;
  var u=(ADM.users||[]).filter(function(x){return x.id===t.dataset.id})[0],nr=t.value;if(!u||u.role===nr)return;
  API.Admin.setRole(u.id,nr).then(function(){toast('已把「'+u.name+'」设为「'+ROLE[nr]+'」','ok');return loadAdmin(true)}).catch(function(er){t.value=u.role;toast(errMsg(er),'bad',4200)});
});
$('#v-settings').addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='nm-in'){ev.preventDefault();saveMyName()}
});
$('#v-settings').addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='k-in'){ev.preventDefault();var b=$('[data-act="key-go"]');if(b)b.click()}
});
var qt;$('#q').addEventListener('input',function(ev){
  clearTimeout(qt);var v=ev.target.value;
  qt=setTimeout(function(){ui.q=v;if(ui.view!=='hall'){setView('hall');return}flipHall(function(){renderSide();renderHall()})},110);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){if(mhost.firstChild)closeModal();else if(!pop.hidden)closePop();else if($('#side').classList.contains('open')){$('#side').classList.remove('open');$('#scrim').classList.remove('show')}}
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(ev.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tag)&&!mhost.firstChild){ev.preventDefault();$('#q').focus()}
});
window.addEventListener('resize',closePop);
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VORDER.indexOf(h)>-1&&h!==ui.view)setView(h)});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if(P.mode==='system'){applyTheme();render()}})}catch(e){}

/* ---------- boot ---------- */
applyTheme();
var wantHash=location.hash.slice(1);
render();syncViewVisibility();
if(!ONLINE){ui.ready=true;render()}
else{
  API.subscribe(function(){refresh()});
  API.Auth.onChange(function(u){
    onAuthUser(u);
    /* honour a #war / #court / #admin / #settings link once the role is known */
    if(wantHash){var h=wantHash;wantHash=null;setTimeout(function(){
      if(h==='settings'||(h==='war'&&rk()>=2)||((h==='court'||h==='admin')&&role()==='admin'))setView(h)},900)}
  });
}
})();
</script>
</body>
</html>
